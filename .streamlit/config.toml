[client]
toolbarMode = "minimal"

[server]
# Serves static/ at app/static/ (the UI sounds in static/sounds).
enableStaticServing = true

[theme]
base = "light"
# Keep in step with chart_theme.py (tests/test_app.py checks every colour here).
primaryColor = "#A04E38"
backgroundColor = "#EDF5F1"
secondaryBackgroundColor = "#DAEBE3"
textColor = "#263028"
linkColor = "#2D6675"
borderColor = "#CFD6C4"
dataframeBorderColor = "#CFD6C4"
dataframeHeaderBackgroundColor = "#DAEBE3"
yellowColor = "#D6AC4E"
yellowBackgroundColor = "#F8ECD3"
yellowTextColor = "#6E4E12"
blueColor = "#62A0B0"
blueBackgroundColor = "#E1F0F3"
blueTextColor = "#22525F"
redColor = "#8A3825"
redBackgroundColor = "#FBE6DE"
redTextColor = "#8A3825"
greenColor = "#4A6B45"
greenBackgroundColor = "#E3ECDF"
greenTextColor = "#34502F"
showWidgetBorder = true
baseRadius = "0.625rem"
buttonRadius = "0.5rem"
# Figtree for all text and headings. Streamlit takes one family per link, so Lexend, for the
# message sentences, loads at the top of style.css.
font = "Figtree:https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&display=swap"
headingFont = "Figtree"
headingFontWeights = [700, 700, 700, 700, 700, 700]
chartCategoricalColors = ["#BCA7ED", "#F8D66F", "#B5F0DD", "#657166"]
